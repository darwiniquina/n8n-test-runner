name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest version package.json claims to support.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Unit tests use a fake n8n client, so no n8n instance is needed here.
      - run: npm test
